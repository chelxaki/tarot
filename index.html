<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarot Reading</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <img class="side-decor side-decor-left" src="images/ui/cat-window-left.png" alt="" aria-hidden="true">
  <img class="side-decor side-decor-right" src="images/ui/window-flowers-right.png" alt="" aria-hidden="true">

  <div class="celestial-decor" aria-hidden="true">
    <span class="decor decor-star-1">✦</span>
    <span class="decor decor-star-2">✧</span>
    <span class="decor decor-star-3">⋆</span>
    <span class="decor decor-moon">☾</span>
    <span class="decor decor-sparkle-1">✧</span>
    <span class="decor decor-sparkle-2">✦</span>
    <span class="decor decor-moon-2">☾</span>
    <span class="decor decor-star-4">⋆</span>
    <span class="decor decor-star-5">✧</span>
  </div>

  <main class="app-shell">
    <div class="top-bar">
      <span class="brand">Tarot</span>
      <span class="tagline-pill"><span class="pill-icon" aria-hidden="true">☾</span>Good Questions · Brighter Days</span>
    </div>

    <div class="content-narrow">
      <header class="app-header">
        <p class="eyebrow">PAUSE ✦ BREATHE ✦ DRAW</p>
        <h1>Ask the Cards</h1>
        <p class="subtitle">A small question can open a new perspective.</p>
      </header>

      <form id="question-form" class="question-form" novalidate>
        <label for="question-input">What's on your mind?</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">✦</span>
          <input
            type="text"
            id="question-input"
            name="question"
            placeholder="Ask your question..."
            autocomplete="off"
          >
        </div>
        <p id="error-message" class="error-message" role="alert" hidden></p>
        <button type="submit" class="draw-button">
          <span class="btn-icon" aria-hidden="true">☾</span>
          <span>Draw Cards</span>
          <span class="btn-icon" aria-hidden="true">✦</span>
        </button>
      </form>

      <p class="tagline-divider">✦ Trust the timing ✦</p>
    </div>

    <section id="results" class="results" hidden aria-live="polite">
      <div class="results-divider" aria-hidden="true">
        <span class="divider-line"></span>
        <span class="divider-star">✧</span>
        <span class="divider-line"></span>
      </div>
      <ul id="card-list" class="card-list"></ul>
    </section>

    <p class="footer-tagline">DIFFERENT QUESTIONS ✦ BRIGHTER DAYS</p>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
